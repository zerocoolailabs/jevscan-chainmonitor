[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jevscan-chainmonitor"
version = "0.1.0"
description = "Flags Ethereum transactions that look like smart-contract exploits"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["aiohttp==3.14.3"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jevscan-chainmonitor = "jevscan_chainmonitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevscan_chainmonitor"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "evidence/", "README.md", "LICENSE", "NOTICE.md", "SECURITY.md", "pyproject.toml",
           "requirements*.lock", "requirements-build.in", ".env.example", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]  # long lines stay where splitting would hurt readability; zips pair validated equal-length lists
